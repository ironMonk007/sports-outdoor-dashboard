<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports & Outdoor L3 Planning Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1117; --card: #1a1d27; --border: #2a2e3f; --text: #e4e6ed;
  --muted: #8b8fa3; --accent: #6366f1; --green: #22c55e; --red: #ef4444;
  --yellow: #eab308; --orange: #f97316; --blue: #3b82f6; --purple: #a855f7;
  --cyan: #06b6d4;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; }
.container { max-width: 1400px; margin: 0 auto; }

/* Header */
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
.header .subtitle { color: var(--muted); font-size: 13px; }

/* Target Input */
.target-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.target-section label { font-size: 14px; font-weight: 500; white-space: nowrap; }
.target-input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; color: var(--text); font-size: 18px; font-weight: 600; width: 200px; text-align: right; }
.target-input:focus { outline: none; border-color: var(--accent); }
.target-meta { color: var(--muted); font-size: 12px; }
.target-meta span { color: var(--green); font-weight: 600; }

/* KPI Cards */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
.kpi-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.kpi-card .value { font-size: 22px; font-weight: 700; }
.kpi-card .value.green { color: var(--green); }
.kpi-card .value.blue { color: var(--blue); }
.kpi-card .value.purple { color: var(--purple); }
.kpi-card .value.orange { color: var(--orange); }

/* L2 Section */
.l2-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.l2-header { padding: 16px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.2s; }
.l2-header:hover { background: rgba(99,102,241,0.05); }
.l2-header .l2-left { display: flex; align-items: center; gap: 12px; }
.l2-header .l2-name { font-size: 16px; font-weight: 600; }
.l2-header .l2-badge { background: var(--accent); color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
.l2-header .l2-right { display: flex; align-items: center; gap: 20px; text-align: right; }
.l2-header .l2-metric { }
.l2-header .l2-metric .val { font-size: 16px; font-weight: 600; }
.l2-header .l2-metric .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.l2-header .arrow { font-size: 18px; color: var(--muted); transition: transform 0.3s; }
.l2-header.open .arrow { transform: rotate(180deg); }
.l2-body { display: none; border-top: 1px solid var(--border); }
.l2-body.open { display: block; }

/* L3 Table */
.l3-table-wrap { padding: 16px 20px; }
.l3-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.l3-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.l3-header:hover { background: rgba(99,102,241,0.03); }
.l3-header .l3-name { font-size: 14px; font-weight: 500; }
.l3-header .l3-stats { display: flex; gap: 16px; font-size: 12px; }
.l3-header .l3-stats .stat-val { font-weight: 600; }
.l3-header .l3-stats .stat-lbl { color: var(--muted); }
.l3-body { display: none; border-top: 1px solid var(--border); }
.l3-body.open { display: block; }

/* Product Table */
.product-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.product-table th { background: var(--card); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; padding: 8px 10px; text-align: right; cursor: pointer; user-select: none; position: sticky; top: 0; }
.product-table th:first-child { text-align: left; }
.product-table th:hover { color: var(--text); }
.product-table td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--border); }
.product-table td:first-child { text-align: left; }
.product-table tr:hover { background: rgba(99,102,241,0.03); }
.product-table .sku-name { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.product-table .up { color: var(--green); }
.product-table .down { color: var(--red); }
.product-table .neutral { color: var(--yellow); }

/* Risk badges */
.risk-flag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.risk-low { background: rgba(34,197,94,0.15); color: var(--green); }
.risk-med { background: rgba(234,179,8,0.15); color: var(--yellow); }
.risk-high { background: rgba(239,68,68,0.15); color: var(--red); }

/* Charts */
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.chart-card h3 { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.chart-wrap { height: 280px; }

/* Buttons */
.btn { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 500; cursor: pointer; }
.btn:hover { opacity: 0.9; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-outline:hover { border-color: var(--accent); color: var(--text); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Responsive */
@media (max-width: 768px) {
  .chart-row { grid-template-columns: 1fr; }
  .target-section { flex-direction: column; align-items: flex-start; }
  .l2-header .l2-right { flex-wrap: wrap; gap: 8px; }
}

/* Sort arrow */
.sort-arrow { font-size: 9px; margin-left: 2px; }

/* No products message */
.no-products { padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }

/* Progress bar */
.progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; }
.progress-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

/* Stock Planning Summary */
.stock-summary { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
.stock-summary-header { padding: 16px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.stock-summary-header:hover { background: rgba(99,102,241,0.05); }
.stock-summary-header h2 { font-size: 16px; font-weight: 600; }
.stock-summary-body { display: none; border-top: 1px solid var(--border); }
.stock-summary-body.open { display: block; }
.stock-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.stock-table th { background: var(--bg); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; padding: 10px 12px; text-align: right; position: sticky; top: 0; }
.stock-table th:first-child, .stock-table th:nth-child(2) { text-align: left; }
.stock-table td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--border); }
.stock-table td:first-child, .stock-table td:nth-child(2) { text-align: left; }
.stock-table tr.l2-row { background: rgba(99,102,241,0.06); font-weight: 600; }
.stock-table tr.l2-row td { font-size: 13px; border-bottom: 2px solid var(--border); }
.stock-table tr.l3-row td:first-child { padding-left: 28px; color: var(--muted); font-size: 11px; }
.stock-table tr.total-row { background: rgba(34,197,94,0.08); font-weight: 700; }
.stock-table tr.total-row td { font-size: 13px; border-top: 2px solid var(--green); }
.stock-highlight { color: var(--green); font-weight: 600; }
.stock-warn { color: var(--orange); font-weight: 600; }
.stock-danger { color: var(--red); font-weight: 600; }

/* L2 color indicators */
.l2-color { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="titleText">Sports & Outdoor L3 Planning Dashboard</h1>
    <div class="subtitle" id="periodText">Loading...</div>
  </div>

  <!-- Target Input -->
  <div class="target-section">
    <label>Revenue Target ($):</label>
    <input type="number" class="target-input" id="targetInput" value="15000" min="0" step="500">
    <div class="target-meta">
      Current baseline: <span id="baselineGmv">$0</span> |
      Growth needed: <span id="growthNeeded">0%</span> |
      <button class="btn" onclick="recalcAll()">Recalculate</button>
      <button class="btn btn-outline" onclick="exportCSV()">Export CSV</button>
    </div>
  </div>

  <!-- KPI Cards -->
  <div class="kpi-row" id="kpiRow"></div>

  <!-- Charts -->
  <div class="chart-row">
    <div class="chart-card">
      <h3>Target Distribution by L2 Category</h3>
      <div class="chart-wrap"><canvas id="l2PieChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Current vs Target GMV by L2</h3>
      <div class="chart-wrap"><canvas id="l2BarChart"></canvas></div>
    </div>
  </div>

  <!-- Stock Planning Summary -->
  <div class="stock-summary">
    <div class="stock-summary-header" onclick="toggleStockSummary(this)">
      <h2>&#128230; Stock Planning Summary — Units Needed to Reach Target</h2>
      <span class="arrow" style="font-size:18px;color:var(--muted)">&#9660;</span>
    </div>
    <div class="stock-summary-body open" id="stockSummaryBody">
      <div style="overflow-x:auto;max-height:600px;overflow-y:auto">
        <table class="stock-table" id="stockTable"></table>
      </div>
    </div>
  </div>

  <!-- L2 Sections -->
  <div id="l2Container"></div>

  <!-- Other/Uncategorized Products -->
  <div id="otherSection" style="display:none"></div>
</div>

var sortState = {};
var l2Colors = ['#6366f1','#22c55e','#3b82f6','#a855f7','#f97316','#06b6d4','#eab308','#ef4444','#ec4899','#14b8a6'];

function init() {
  document.getElementById('periodText').textContent = D.dataPeriod + ' | ' + D.totalProducts + ' products | L1: ' + D.l1Name;
  document.getElementById('baselineGmv').textContent = '$' + fmt(D.l1Gmv);
  document.getElementById('titleText').textContent = D.l1Name + ' L3 Planning Dashboard';

  // Set default target to 20% growth over baseline
  var defaultTarget = Math.ceil(D.l1Gmv * 1.2 / 100) * 100;
  document.getElementById('targetInput').value = defaultTarget;

  recalcAll();

  document.getElementById('targetInput').addEventListener('input', debounce(recalcAll, 300));
}

function debounce(fn, ms) {
  var t; return function() { clearTimeout(t); t = setTimeout(fn, ms); };
}

function recalcAll() {
  var target = parseFloat(document.getElementById('targetInput').value) || 0;
  var baseline = D.l1Gmv;
  var growth = baseline > 0 ? ((target - baseline) / baseline * 100) : 0;

  document.getElementById('growthNeeded').textContent = (growth > 0 ? '+' : '') + growth.toFixed(1) + '%';
  document.getElementById('growthNeeded').style.color = growth > 30 ? 'var(--red)' : growth > 10 ? 'var(--yellow)' : 'var(--green)';

  renderKPIs(target, baseline, growth);
  renderCharts(target);
  renderStockSummary(target);
  renderL2Sections(target);
  renderOther();
}

function renderKPIs(target, baseline, growth) {
  var totalProducts = D.totalProducts;
  var totalL2s = D.l2Categories.length;
  var totalL3s = 0;
  D.l2Categories.forEach(function(l2) { totalL3s += l2.l3s.length; });

  // Calculate total projected units and current items
  var totalProjUnits = 0;
  var totalCurrentItems = 0;
  D.l2Categories.forEach(function(l2) {
    var l2Target = target * l2.proportion;
    l2.l3s.forEach(function(l3) {
      var l3Target = l2Target * l3.proportion;
      l3.products.forEach(function(p) {
        var l3TotalGmv = l3.gmv;
        var skuWeight = l3TotalGmv > 0 ? p.gmv / l3TotalGmv : 0;
        var projRev = l3Target * skuWeight;
        var projUnits = p.asp > 0 ? Math.ceil(projRev / p.asp) : 0;
        totalProjUnits += projUnits;
        totalCurrentItems += p.items;
      });
    });
  });

  var incrementalUnits = totalProjUnits - totalCurrentItems;

  var html =
    kpiCard('Target Revenue', '$' + fmt(target), 'green') +
    kpiCard('Current Baseline', '$' + fmt(baseline), 'blue') +
    kpiCard('Growth Needed', (growth > 0 ? '+' : '') + growth.toFixed(1) + '%', growth > 30 ? 'orange' : 'purple') +
    kpiCard('Current Items Sold', fmt(totalCurrentItems), '') +
    kpiCard('Projected Units', fmt(totalProjUnits), 'green') +
    kpiCard('Incremental to Stock', (incrementalUnits > 0 ? '+' : '') + fmt(incrementalUnits), incrementalUnits > 0 ? 'orange' : 'green') +
    kpiCard('L2 Categories', totalL2s, '') +
    kpiCard('L3 Subcategories', totalL3s, '') +
    kpiCard('Total Products', totalProducts, '');
  document.getElementById('kpiRow').innerHTML = html;
}

function kpiCard(label, value, colorCls) {
  return '<div class="kpi-card"><div class="label">' + label + '</div><div class="value ' + (colorCls||'') + '">' + value + '</div></div>';
}

var pieChart = null, barChart = null;
function renderCharts(target) {
  // Pie chart
  var pieLabels = [], pieData = [], pieColors = [];
  D.l2Categories.forEach(function(l2, i) {
    var l2Target = target * l2.proportion;
    if (l2Target > 0) {
      pieLabels.push(l2.name);
      pieData.push(l2Target);
      pieColors.push(l2Colors[i % l2Colors.length]);
    }
  });

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('l2PieChart'), {
    type: 'doughnut',
    data: { labels: pieLabels, datasets: [{ data: pieData, backgroundColor: pieColors, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { color: '#8b8fa3', font: { size: 10 }, padding: 8 } },
        tooltip: { callbacks: { label: function(ctx) { return ctx.label + ': $' + fmt(ctx.raw) + ' (' + (ctx.raw/target*100).toFixed(1) + '%)'; } } }
      }
    }
  });

  // Bar chart
  var barLabels = [], barCurrent = [], barTargetArr = [];
  D.l2Categories.forEach(function(l2) {
    barLabels.push(l2.name.length > 15 ? l2.name.substring(0,13) + '..' : l2.name);
    barCurrent.push(l2.gmv);
    barTargetArr.push(target * l2.proportion);
  });

  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('l2BarChart'), {
    type: 'bar',
    data: {
      labels: barLabels,
      datasets: [
        { label: 'Current GMV', data: barCurrent, backgroundColor: 'rgba(99,102,241,.5)', borderRadius: 4 },
        { label: 'Target GMV', data: barTargetArr, backgroundColor: 'rgba(34,197,94,.5)', borderRadius: 4 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#8b8fa3', font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: '#8b8fa3', font: { size: 9 } }, grid: { display: false } },
        y: { ticks: { color: '#8b8fa3', callback: function(v) { return '$' + fmt(v); } }, grid: { color: 'rgba(42,46,63,.5)' } }
      }
    }
  });
}

function renderStockSummary(target) {
  var table = document.getElementById('stockTable');
  var html = '<thead><tr>';
  html += '<th style="text-align:left">Category (L2)</th>';
  html += '<th style="text-align:left">Subcategory (L3)</th>';
  html += '<th>Current Items Sold</th>';
  html += '<th>Projected Units Needed</th>';
  html += '<th>Incremental to Stock</th>';
  html += '<th>Growth %</th>';
  html += '</tr></thead><tbody>';

  var grandCurrentItems = 0;
  var grandProjUnits = 0;

  D.l2Categories.forEach(function(l2) {
    var l2Target = target * l2.proportion;
    var l2CurrentItems = 0;
    var l2ProjUnits = 0;

    // First pass: calculate L2 totals
    l2.l3s.forEach(function(l3) {
      var l3Target = l2Target * l3.proportion;
      var l3TotalGmv = l3.gmv;
      l3.products.forEach(function(p) {
        l2CurrentItems += p.items;
        var skuWeight = l3TotalGmv > 0 ? p.gmv / l3TotalGmv : 0;
        var projRev = l3Target * skuWeight;
        var projUnits = p.asp > 0 ? Math.ceil(projRev / p.asp) : 0;
        l2ProjUnits += projUnits;
      });
    });

    grandCurrentItems += l2CurrentItems;
    grandProjUnits += l2ProjUnits;

    var l2Incr = l2ProjUnits - l2CurrentItems;
    var l2Growth = l2CurrentItems > 0 ? ((l2ProjUnits - l2CurrentItems) / l2CurrentItems * 100) : 0;
    var l2GrowthCls = l2Growth > 50 ? 'stock-danger' : l2Growth > 20 ? 'stock-warn' : 'stock-highlight';

    // L2 summary row
    html += '<tr class="l2-row">';
    html += '<td style="text-align:left">' + l2.name + '</td>';
    html += '<td style="text-align:left;color:var(--muted)">' + l2.l3s.length + ' subcategories</td>';
    html += '<td>' + l2CurrentItems.toLocaleString() + '</td>';
    html += '<td class="stock-highlight">' + l2ProjUnits.toLocaleString() + '</td>';
    html += '<td class="' + (l2Incr > 0 ? 'stock-warn' : 'stock-highlight') + '">' + (l2Incr > 0 ? '+' : '') + l2Incr.toLocaleString() + '</td>';
    html += '<td class="' + l2GrowthCls + '">' + (l2Growth > 0 ? '+' : '') + l2Growth.toFixed(1) + '%</td>';
    html += '</tr>';

    // L3 detail rows
    l2.l3s.forEach(function(l3) {
      var l3Target = l2Target * l3.proportion;
      var l3TotalGmv = l3.gmv;
      var l3CurrentItems = 0;
      var l3ProjUnits = 0;

      l3.products.forEach(function(p) {
        l3CurrentItems += p.items;
        var skuWeight = l3TotalGmv > 0 ? p.gmv / l3TotalGmv : 0;
        var projRev = l3Target * skuWeight;
        var projUnits = p.asp > 0 ? Math.ceil(projRev / p.asp) : 0;
        l3ProjUnits += projUnits;
      });

      var l3Incr = l3ProjUnits - l3CurrentItems;
      var l3Growth = l3CurrentItems > 0 ? ((l3ProjUnits - l3CurrentItems) / l3CurrentItems * 100) : 0;
      var l3GrowthCls = l3Growth > 50 ? 'stock-danger' : l3Growth > 20 ? 'stock-warn' : 'stock-highlight';

      html += '<tr class="l3-row">';
      html += '<td style="text-align:left"></td>';
      html += '<td style="text-align:left">' + l3.name + '</td>';
      html += '<td>' + l3CurrentItems.toLocaleString() + '</td>';
      html += '<td>' + l3ProjUnits.toLocaleString() + '</td>';
      html += '<td class="' + (l3Incr > 0 ? 'stock-warn' : 'stock-highlight') + '">' + (l3Incr > 0 ? '+' : '') + l3Incr.toLocaleString() + '</td>';
      html += '<td class="' + l3GrowthCls + '">' + (l3Growth > 0 ? '+' : '') + l3Growth.toFixed(1) + '%</td>';
      html += '</tr>';
    });
  });

  // Grand total row
  var grandIncr = grandProjUnits - grandCurrentItems;
  var grandGrowth = grandCurrentItems > 0 ? ((grandProjUnits - grandCurrentItems) / grandCurrentItems * 100) : 0;
  html += '<tr class="total-row">';
  html += '<td style="text-align:left">TOTAL</td>';
  html += '<td style="text-align:left">All categories</td>';
  html += '<td>' + grandCurrentItems.toLocaleString() + '</td>';
  html += '<td>' + grandProjUnits.toLocaleString() + '</td>';
  html += '<td>' + (grandIncr > 0 ? '+' : '') + grandIncr.toLocaleString() + '</td>';
  html += '<td>' + (grandGrowth > 0 ? '+' : '') + grandGrowth.toFixed(1) + '%</td>';
  html += '</tr>';

  html += '</tbody>';
  table.innerHTML = html;
}

function toggleStockSummary(el) {
  var body = document.getElementById('stockSummaryBody');
  body.classList.toggle('open');
  var arrow = el.querySelector('.arrow');
  if (body.classList.contains('open')) arrow.style.transform = 'rotate(180deg)';
  else arrow.style.transform = '';
}

  var container = document.getElementById('l2Container');
  var html = '';

  D.l2Categories.forEach(function(l2, l2i) {
    var l2Target = target * l2.proportion;
    var l2Growth = l2.gmv > 0 ? ((l2Target - l2.gmv) / l2.gmv * 100) : 0;
    var growthCls = l2Growth > 50 ? 'down' : l2Growth > 20 ? 'neutral' : 'up';

    html += '<div class="l2-section">';
    html += '<div class="l2-header" onclick="toggleL2(this, ' + l2i + ')">';
    html += '  <div class="l2-left">';
    html += '    <span class="l2-color" style="background:' + color + '"></span>';
    html += '    <span class="l2-name">' + l2.name + '</span>';
    html += '    <span class="l2-badge">' + (l2.proportion * 100).toFixed(1) + '%</span>';
    html += '  </div>';
    html += '  <div class="l2-right">';
    html += '    <div class="l2-metric"><div class="val">$' + fmt(l2Target) + '</div><div class="lbl">Target</div></div>';
    html += '    <div class="l2-metric"><div class="val">$' + fmt(l2.gmv) + '</div><div class="lbl">Current</div></div>';
    html += '    <div class="l2-metric"><div class="val ' + growthCls + '">' + (l2Growth > 0 ? '+' : '') + l2Growth.toFixed(1) + '%</div><div class="lbl">Growth</div></div>';
    html += '    <div class="l2-metric"><div class="val">' + l2.l3s.length + '</div><div class="lbl">L3s</div></div>';
    html += '    <span class="arrow">&#9660;</span>';
    html += '  </div>';
    html += '</div>';

    html += '  <div class="l2-body" id="l2body-' + l2i + '">';
    html += '    <div class="l3-table-wrap">';

    // L3 cards
    l2.l3s.forEach(function(l3, l3i) {
      var l3Target = l2Target * l3.proportion;
      var l3Growth = l3.gmv > 0 ? ((l3Target - l3.gmv) / l3.gmv * 100) : 0;
      var l3GrowthCls = l3Growth > 50 ? 'down' : l3Growth > 20 ? 'neutral' : 'up';
      var prodCount = l3.products.length;

      html += '<div class="l3-card">';
      html += '  <div class="l3-header" onclick="toggleL3(this, ' + l2i + ',' + l3i + ')">';
      html += '    <div class="l3-name">' + l3.name + ' <span style="color:var(--muted);font-size:11px">(' + (l3.proportion*100).toFixed(1) + '% of L2 | ' + prodCount + ' products)</span></div>';
      html += '    <div class="l3-stats">';
      html += '      <div><span class="stat-val">$' + fmt(l3Target) + '</span> <span class="stat-lbl">target</span></div>';
      html += '      <div><span class="stat-val">$' + fmt(l3.gmv) + '</span> <span class="stat-lbl">current</span></div>';
      html += '      <div><span class="stat-val ' + l3GrowthCls + '">' + (l3Growth > 0 ? '+' : '') + l3Growth.toFixed(1) + '%</span> <span class="stat-lbl">growth</span></div>';
      html += '      <span class="arrow" style="font-size:14px">&#9660;</span>';
      html += '    </div>';
      html += '  </div>';

      html += '  <div class="l3-body" id="l3body-' + l2i + '-' + l3i + '">';
      if (prodCount === 0) {
        html += '    <div class="no-products">No products mapped to this category. Products may need to be sourced or mapped manually.</div>';
      } else {
        html += renderProductTable(l2, l3, l2Target, l2i, l3i);
      }
      html += '  </div>';
      html += '</div>';
    });

    html += '    </div>';
    html += '  </div>';
    html += '</div>';
  });

  container.innerHTML = html;
}

function renderProductTable(l2, l3, l2Target, l2i, l3i) {
  var l3Target = l2Target * l3.proportion;
  var l3TotalGmv = l3.gmv;

  // Calculate projections for each product
  var projected = l3.products.map(function(p) {
    var skuWeight = l3TotalGmv > 0 ? p.gmv / l3TotalGmv : 0;
    var projRevenue = l3Target * skuWeight;
    var projUnits = p.asp > 0 ? Math.ceil(projRevenue / p.asp) : 0;
    var incrementalUnits = projUnits - p.items;
    var growthNeeded = p.items > 0 ? ((projUnits - p.items) / p.items * 100) : (projUnits > 0 ? 999 : 0);

    return {
      sku: p.sku, name: p.name, brand: p.brand, img: p.img,
      gmv: p.gmv, orders: p.orders, items: p.items, asp: p.asp, price: p.price,
      pdpv: p.pdpv, pdpuv: p.pdpuv, atcuv: p.atcuv, buyers: p.buyers,
      skuWeight: (skuWeight * 100).toFixed(1),
      projRevenue: Math.round(projRevenue),
      projUnits: projUnits,
      incrementalUnits: incrementalUnits,
      growthNeeded: Math.round(growthNeeded * 10) / 10,
      risk: growthNeeded > 50 ? 'high' : growthNeeded > 20 ? 'med' : 'low'
    };
  });

  // Sort by GMV desc by default
  projected.sort(function(a, b) { return b.gmv - a.gmv; });
  projected = projected.slice(0, 200);

  var tableId = 'tbl-' + l2i + '-' + l3i;
  sortState[tableId] = { col: 'gmv', dir: -1 };

  var html = '<div style="overflow-x:auto;max-height:400px;overflow-y:auto">';
  html += '<table class="product-table" id="' + tableId + '">';
  html += '<thead><tr>';
  var cols = [
    {key:'rank', label:'#', align:'left'},
    {key:'name', label:'Product', align:'left'},
    {key:'brand', label:'Brand', align:'left'},
    {key:'gmv', label:'Current GMV', align:'right'},
    {key:'orders', label:'Orders', align:'right'},
    {key:'items', label:'Items Sold', align:'right'},
    {key:'asp', label:'ASP', align:'right'},
    {key:'skuWeight', label:'L3 Share %', align:'right'},
    {key:'projRevenue', label:'Projected Rev', align:'right'},
    {key:'projUnits', label:'Proj. Units', align:'right'},
    {key:'incrementalUnits', label:'Incremental', align:'right'},
    {key:'growthNeeded', label:'Growth %', align:'right'},
    {key:'risk', label:'Risk', align:'right'}
  ];
  cols.forEach(function(c) {
    html += '<th onclick="sortTable(\'' + tableId + '\',\'' + c.key + '\',' + l2i + ',' + l3i + ')" style="text-align:' + c.align + '">' + c.label + '</th>';
  });
  html += '</tr></thead><tbody>';

  projected.forEach(function(s, i) {
    var riskLabel = s.risk === 'high' ? 'High' : s.risk === 'med' ? 'Med' : 'Low';
    var incrCls = s.incrementalUnits > 0 ? 'down' : 'up';
    var growthCls = s.growthNeeded > 30 ? 'down' : s.growthNeeded > 0 ? 'neutral' : 'up';

    html += '<tr>';
    html += '<td style="text-align:left">' + (i+1) + '</td>';
    html += '<td class="sku-name" title="' + escHtml(s.name) + '">' + escHtml(s.name) + '</td>';
    html += '<td style="text-align:left;color:var(--muted)">' + escHtml(s.brand) + '</td>';
    html += '<td>$' + fmt(s.gmv) + '</td>';
    html += '<td>' + s.orders + '</td>';
    html += '<td>' + s.items + '</td>';
    html += '<td>$' + s.asp.toFixed(2) + '</td>';
    html += '<td>' + s.skuWeight + '%</td>';
    html += '<td><strong>$' + fmt(s.projRevenue) + '</strong></td>';
    html += '<td>' + s.projUnits + '</td>';
    html += '<td class="' + incrCls + '">' + (s.incrementalUnits > 0 ? '+' : '') + s.incrementalUnits + '</td>';
    html += '<td class="' + growthCls + '">' + (s.growthNeeded > 0 ? '+' : '') + s.growthNeeded + '%</td>';
    html += '<td><span class="risk-flag risk-' + s.risk + '">' + riskLabel + '</span></td>';
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

function sortTable(tableId, col, l2i, l3i) {
  var state = sortState[tableId];
  if (state.col === col) state.dir *= -1;
  else { state.col = col; state.dir = -1; }

  // Re-render the specific L3 body
  var target = parseFloat(document.getElementById('targetInput').value) || 0;
  var l2 = D.l2Categories[l2i];
  var l2Target = target * l2.proportion;
  var l3 = l2.l3s[l3i];

  var body = document.getElementById('l3body-' + l2i + '-' + l3i);
  body.innerHTML = renderProductTable(l2, l3, l2Target, l2i, l3i);
}

function exportCSV() {
  var target = parseFloat(document.getElementById('targetInput').value) || 0;
  var csv = 'L2 Category,L3 Category,Product Name,Brand,Daraz SKU,Current GMV ($),Orders,Items Sold,ASP ($),L3 Share (%),L3 Target ($),Projected Revenue ($),Projected Units,Incremental Units,Growth Needed (%),Risk Level\n';

  D.l2Categories.forEach(function(l2) {
    var l2Target = target * l2.proportion;
    l2.l3s.forEach(function(l3) {
      var l3Target = l2Target * l3.proportion;
      var l3TotalGmv = l3.gmv;
      l3.products.forEach(function(p) {
        var skuWeight = l3TotalGmv > 0 ? p.gmv / l3TotalGmv : 0;
        var projRev = l3Target * skuWeight;
        var projUnits = p.asp > 0 ? Math.ceil(projRev / p.asp) : 0;
        var incr = projUnits - p.items;
        var growth = p.items > 0 ? ((projUnits - p.items) / p.items * 100) : 0;
        var risk = growth > 50 ? 'High' : growth > 20 ? 'Medium' : 'Low';

        csv += '"' + l2.name + '","' + l3.name + '","' + (p.name||'').replace(/"/g,'""') + '","' + (p.brand||'') + '","' + p.sku + '",' + p.gmv + ',' + p.orders + ',' + p.items + ',' + p.asp.toFixed(2) + ',' + (skuWeight*100).toFixed(1) + ',' + l3Target.toFixed(2) + ',' + projRev.toFixed(2) + ',' + projUnits + ',' + incr + ',' + growth.toFixed(1) + ',' + risk + '\n';
      });
    });
  });

  var blob = new Blob([csv], {type: 'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sports-outdoor-projection-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmt(n) {
  if (n === undefined || n === null) return '0';
  if (Math.abs(n) >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (Math.abs(n) >= 1000) return (n/1000).toFixed(1) + 'K';
  return Math.round(n).toString();
}
